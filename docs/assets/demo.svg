<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 392" role="img" aria-labelledby="demo-title">
  <title id="demo-title">The big knob of a macro pad with nine keys and three knobs is turned; with every detent the nozzle of a 3D printer moves down one step towards a sheet of paper on the bed, and the console reports each move. The step key switches from 1 mm to 0.01 mm, and the pad's light from red to green.</title>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace; font-size: 14px; fill: #ececea; }
    .mono tspan { fill: #9a9a94; }
    .key rect { fill: #33332f; stroke: #4d4d47; stroke-width: 1.5; }
    .key text { font-size: 12px; font-weight: 600; text-anchor: middle; }
    .key .on { fill: #161615; }
    .key .home { fill: none; stroke: #ececea; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
    .stop rect { fill: #b3261e; stroke: #b3261e; }
    .stop text { fill: #ffffff; }
    #step-key text { fill: #1d1d1b; }
    .knob { fill: #33332f; stroke: #4d4d47; stroke-width: 1.5; }
    .mark line { stroke: #d6d6d0; stroke-width: 4; stroke-linecap: round; }
    .turns path { fill: var(--axis); }
    .turns .arc { fill: none; stroke: var(--axis); stroke-width: 3.6; }
    .turns text { fill: var(--axis); font-size: 12px; font-weight: 600; text-anchor: middle; }

    /* One loop is 9 s. The big knob turns towards Z− at 0.6, 1.4, 2.2 and 3.0 s
       (1 mm), the step key goes to 0.01 mm at 4.0 s, fine detents follow at 4.8
       and 5.6 s, the paper drags, then everything resets. */
    #head { animation: head 9s ease-in-out infinite; }
    #knob-mark { animation: knob 9s ease-in-out infinite; transform-origin: 282.58px 322.7px; }
    #z-minus path, #z-minus text { animation: z-minus 9s linear infinite; }
    #step-key rect { animation: step-key 9s linear infinite; }
    #glow { animation: glow 9s linear infinite; }
    #paper { animation: paper 9s ease-in-out infinite; }
    #ok { animation: ok 9s linear infinite; }
    #lines { animation: lines 9s ease-out infinite; }

    @keyframes head {
      0%, 6.67% { transform: translateY(0); }
      8.33%, 15.56% { transform: translateY(14px); }
      17.22%, 24.44% { transform: translateY(28px); }
      26.11%, 33.33% { transform: translateY(42px); }
      35%, 53.33% { transform: translateY(56px); }
      55%, 62.22% { transform: translateY(60px); }
      63.89%, 84.44% { transform: translateY(64px); }
      95.56%, 100% { transform: translateY(0); }
    }
    /* Anticlockwise, the way the arrow above the knob shows Z−. */
    @keyframes knob {
      0%, 6.67% { transform: rotate(0deg); }
      8.33%, 15.56% { transform: rotate(-30deg); }
      17.22%, 24.44% { transform: rotate(-60deg); }
      26.11%, 33.33% { transform: rotate(-90deg); }
      35%, 53.33% { transform: rotate(-120deg); }
      55%, 62.22% { transform: rotate(-150deg); }
      63.89%, 84.44% { transform: rotate(-180deg); }
      95.56%, 100% { transform: rotate(0deg); }
    }
    /* The end of the arrow that was turned lights up, as on the web page. */
    @keyframes z-minus {
      0%, 6.6% { fill: #60a5fa; } 7% { fill: #e0661b; } 10% { fill: #60a5fa; }
      15.5% { fill: #60a5fa; } 15.9% { fill: #e0661b; } 18.9% { fill: #60a5fa; }
      24.4% { fill: #60a5fa; } 24.8% { fill: #e0661b; } 27.8% { fill: #60a5fa; }
      33.3% { fill: #60a5fa; } 33.7% { fill: #e0661b; } 36.7% { fill: #60a5fa; }
      53.3% { fill: #60a5fa; } 53.7% { fill: #e0661b; } 56.7% { fill: #60a5fa; }
      62.2% { fill: #60a5fa; } 62.6% { fill: #e0661b; } 65.6% { fill: #60a5fa; }
      100% { fill: #60a5fa; }
    }
    /* The step key shows the step size in traffic light colours, and the pad lights up in them. */
    @keyframes step-key {
      0%, 44.4% { fill: #f2554d; }
      44.5%, 47.2% { fill: #e0661b; }
      47.3%, 95.5% { fill: #5cb874; }
      95.6%, 100% { fill: #f2554d; }
    }
    @keyframes glow {
      0%, 44.4% { fill: #f2554d; }
      46%, 95.5% { fill: #5cb874; }
      95.6%, 100% { fill: #f2554d; }
    }
    @keyframes paper {
      0%, 64% { transform: translateX(0); }
      66% { transform: translateX(-4px); }
      68% { transform: translateX(3px); }
      70% { transform: translateX(-2px); }
      72%, 100% { transform: translateX(0); }
    }
    @keyframes ok {
      0%, 65% { opacity: 0; }
      67%, 84% { opacity: 1; }
      88%, 100% { opacity: 0; }
    }
    /* Every message comes in at the bottom and pushes the older ones up. */
    @keyframes lines {
      0%, 7% { transform: translateY(19px); opacity: 1; }
      8.5%, 15.9% { transform: translateY(0); }
      17.4%, 24.8% { transform: translateY(-19px); }
      26.3%, 33.7% { transform: translateY(-38px); }
      35.2%, 44.5% { transform: translateY(-57px); }
      46%, 53.7% { transform: translateY(-76px); }
      55.2%, 62.6% { transform: translateY(-95px); }
      64.1%, 86% { transform: translateY(-114px); opacity: 1; }
      89%, 92% { transform: translateY(-114px); opacity: 0; }
      92.1%, 100% { transform: translateY(19px); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>
  <defs>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5"/></filter>
    <clipPath id="console-clip"><rect x="420" y="306" width="300" height="59"/></clipPath>
  </defs>

  <rect width="760" height="392" rx="18" fill="#1b1b1a"/>
  <text x="36" y="44" fill="#ececea" font-size="20" font-weight="700">Eyes on the nozzle. Fingers on the knob.</text>

  <!-- The pad as the jogpad web page draws it: nine keys and three knobs, lit in the colour of the step size. -->
  <path d="M-0.2 0.08 A0.18 0.18 0 0 1 -0.02 -0.1 H4.57 A0.5 0.5 0 0 1 5.07 0.4 V4.55 A0.8 0.8 0 0 1 3.47 4.55 V3.62 A0.45 0.45 0 0 0 3.02 3.17 H0 A0.2 0.2 0 0 1 -0.2 2.97 Z" transform="translate(52 77) scale(54)" fill="#262624" stroke="#3d3d38" stroke-width="1.5" vector-effect="non-scaling-stroke"/>
  <rect id="glow" x="52" y="77" width="162" height="162" rx="8" filter="url(#blur)"/>
  <g class="key"><rect x="54.7" y="79.7" width="48.6" height="48.6" rx="6"/>
    <path class="home" d="M64.42,106.92 L79,92.34 L93.58,106.92 M68.79,102.54 L68.79,118.58 L89.21,118.58 L89.21,102.54 M75.6,118.58 L75.6,110.32 L82.4,110.32 L82.4,118.58"/>
  </g>
  <g class="key"><rect x="108.7" y="79.7" width="48.6" height="48.6" rx="6"/>
    <polygon fill="#4cc274" points="0.00,-20.41 18.47,-3.89 10.21,-3.89 10.21,18.47 -10.21,18.47 -10.21,-3.89 -18.47,-3.89" transform="translate(133 104) rotate(0)"/>
    <text class="on" x="133" y="115.49">Y+</text>
  </g>
  <g class="key stop"><rect x="162.7" y="79.7" width="48.6" height="48.6" rx="6"/>
    <text class="action" x="187" y="108.5">STOP</text>
  </g>
  <g class="key"><rect x="54.7" y="133.7" width="48.6" height="48.6" rx="6"/>
    <polygon fill="#f2726a" points="0.00,-20.41 18.47,-3.89 10.21,-3.89 10.21,18.47 -10.21,18.47 -10.21,-3.89 -18.47,-3.89" transform="translate(79 158) rotate(270)"/>
    <text class="on" x="86.29" y="162.2">X−</text>
  </g>
  <g class="key" id="step-key"><rect x="108.7" y="133.7" width="48.6" height="48.6" rx="6"/>
    <text class="action" x="133" y="162.5">Step</text>
  </g>
  <g class="key"><rect x="162.7" y="133.7" width="48.6" height="48.6" rx="6"/>
    <polygon fill="#f2726a" points="0.00,-20.41 18.47,-3.89 10.21,-3.89 10.21,18.47 -10.21,18.47 -10.21,-3.89 -18.47,-3.89" transform="translate(187 158) rotate(90)"/>
    <text class="on" x="179.71" y="162.2">X+</text>
  </g>
  <g class="key"><rect x="54.7" y="187.7" width="48.6" height="48.6" rx="6"/>
    <polygon fill="#e0a53a" points="-18.47,-7.29 18.47,-7.29 18.47,7.29 -18.47,7.29" transform="translate(79 212)"/>
    <text class="on" x="79" y="216.2">E</text>
  </g>
  <g class="key"><rect x="108.7" y="187.7" width="48.6" height="48.6" rx="6"/>
    <polygon fill="#4cc274" points="0.00,-20.41 18.47,-3.89 10.21,-3.89 10.21,18.47 -10.21,18.47 -10.21,-3.89 -18.47,-3.89" transform="translate(133 212) rotate(180)"/>
    <text class="on" x="133" y="208.91">Y−</text>
  </g>
  <g class="key"><rect x="162.7" y="187.7" width="48.6" height="48.6" rx="6"/>
    <polygon fill="#e0a53a" points="-7.29,-18.47 7.29,-18.47 7.29,-7.29 18.47,-7.29 18.47,7.29 7.29,7.29 7.29,18.47 -7.29,18.47 -7.29,7.29 -18.47,7.29 -18.47,-7.29 -7.29,-7.29" transform="translate(187 212)"/>
    <text class="on" x="187" y="216.2">E</text>
  </g>
  <circle class="knob" cx="282.58" cy="123.98" r="24.3"/>
  <g class="mark"><line x1="282.58" y1="116.69" x2="282.58" y2="105.03"/></g>
  <g class="turns" style="--axis: #f2726a">
    <path class="arc" d="M274.85,91.59 A33.3 33.3 0 0 1 290.31,91.59"/>
    <g><path d="M264.93,95.74 L273.6,86.34 L276.11,96.84 Z"/><text x="259.21" y="90.78">X−</text></g>
    <g><path d="M300.23,95.74 L291.56,86.34 L289.05,96.84 Z"/><text x="305.95" y="90.78">X+</text></g>
  </g>
  <circle class="knob" cx="282.58" cy="219.56" r="24.3"/>
  <g class="mark"><line x1="282.58" y1="212.27" x2="282.58" y2="200.61"/></g>
  <g class="turns" style="--axis: #4cc274">
    <path class="arc" d="M274.85,187.17 A33.3 33.3 0 0 1 290.31,187.17"/>
    <g><path d="M264.93,191.32 L273.6,181.92 L276.11,192.42 Z"/><text x="259.21" y="186.36">Y−</text></g>
    <g><path d="M300.23,191.32 L291.56,181.92 L289.05,192.42 Z"/><text x="305.95" y="186.36">Y+</text></g>
  </g>
  <circle class="knob" cx="282.58" cy="322.7" r="37.8"/>
  <g id="knob-mark" class="mark"><line x1="282.58" y1="311.36" x2="282.58" y2="293.22"/></g>
  <g class="turns" style="--axis: #60a5fa">
    <path class="arc" d="M267.52,278.39 A46.8 46.8 0 0 1 297.64,278.39"/>
    <g id="z-minus"><path d="M257.78,283.01 L265.78,273.28 L269.25,283.5 Z"/><text x="252.06" y="278.05">Z−</text></g>
    <g><path d="M307.38,283.01 L299.38,273.28 L295.91,283.5 Z"/><text x="313.1" y="278.05">Z+</text></g>
  </g>

  <!-- The printer: gantry, hotend, bed and a sheet of paper. -->
  <rect x="420" y="66" width="10" height="190" rx="3" fill="#2f2f2b"/>
  <rect x="710" y="66" width="10" height="190" rx="3" fill="#2f2f2b"/>
  <g id="head">
    <rect x="420" y="92" width="300" height="10" rx="3" fill="#3d3d38"/>
    <rect x="532" y="84" width="76" height="26" rx="5" fill="#4d4d47"/>
    <rect x="552" y="110" width="36" height="26" rx="3" fill="#c4520f"/>
    <rect x="560" y="136" width="20" height="8" fill="#d6d6d0"/>
    <path d="M562 144 L578 144 L572 154 L568 154 Z" fill="#e8e8e2"/>
  </g>
  <g id="paper">
    <rect x="510" y="218" width="140" height="4" rx="1" fill="#f4f4f2" transform="rotate(-1.5 580 220)"/>
  </g>
  <rect x="440" y="222" width="260" height="14" rx="3" fill="#5a5a54"/>
  <text id="ok" x="700" y="264" text-anchor="end" fill="#5bbf7a" font-size="15" font-weight="700" opacity="0">paper drags ✓</text>

  <!-- The console of Mainsail or Fluidd: the newest message at the bottom. -->
  <rect x="420" y="296" width="300" height="72" rx="7" fill="#111110"/>
  <g clip-path="url(#console-clip)">
    <g id="lines">
      <text class="mono" x="434" y="358"><tspan>jogpad</tspan> Z -1 mm</text>
      <text class="mono" x="434" y="377"><tspan>jogpad</tspan> Z -1 mm</text>
      <text class="mono" x="434" y="396"><tspan>jogpad</tspan> Z -1 mm</text>
      <text class="mono" x="434" y="415"><tspan>jogpad</tspan> Z -1 mm</text>
      <text class="mono" x="434" y="434"><tspan>jogpad</tspan> Step 0.01 mm</text>
      <text class="mono" x="434" y="453"><tspan>jogpad</tspan> Z -0.01 mm</text>
      <text class="mono" x="434" y="472"><tspan>jogpad</tspan> Z -0.01 mm</text>
    </g>
  </g>
</svg>
