<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="demo-title">
  <title id="demo-title">A knob on a macro pad is turned; with every detent the nozzle of a 3D printer moves down one step towards a sheet of paper on the bed, and the console reports each move.</title>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, "Cascadia Mono", Menlo, Consolas, monospace; font-size: 15px; }
    .muted { fill: #9a9a94; }
    .key rect { fill: #33332f; stroke: #4d4d47; stroke-width: 1.5; }
    .key text { fill: #d6d6d0; font-size: 12px; font-weight: 600; text-anchor: middle; }

    /* One loop is 9 s. Detents at 0.6, 1.4, 2.2, 3.0 s (1 mm), step key at 4.0 s,
       fine detents at 4.8 and 5.6 s (0.1 mm), the paper drags, then everything resets. */
    #head { animation: head 9s ease-in-out infinite; }
    #knob-mark { animation: knob 9s ease-in-out infinite; transform-origin: 300px 205px; }
    #step-key rect { animation: step-key 9s linear infinite; }
    #paper { animation: paper 9s ease-in-out infinite; }
    #ok { animation: ok 9s linear infinite; }
    #c-ready { animation: c-ready 9s linear infinite; }
    #c-coarse { animation: c-coarse 9s linear infinite; }
    #c-step { animation: c-step 9s linear infinite; }
    #c-fine { animation: c-fine 9s linear infinite; }
    #pulse { animation: pulse 9s linear infinite; }

    @keyframes head {
      0%, 6.67% { transform: translateY(0); }
      8.33%, 15.56% { transform: translateY(14px); }
      17.22%, 24.44% { transform: translateY(28px); }
      26.11%, 33.33% { transform: translateY(42px); }
      35%, 53.33% { transform: translateY(56px); }
      55%, 62.22% { transform: translateY(61px); }
      63.89%, 84.44% { transform: translateY(66px); }
      95.56%, 100% { transform: translateY(0); }
    }
    @keyframes knob {
      0%, 6.67% { transform: rotate(0deg); }
      8.33%, 15.56% { transform: rotate(30deg); }
      17.22%, 24.44% { transform: rotate(60deg); }
      26.11%, 33.33% { transform: rotate(90deg); }
      35%, 53.33% { transform: rotate(120deg); }
      55%, 62.22% { transform: rotate(150deg); }
      63.89%, 84.44% { transform: rotate(180deg); }
      95.56%, 100% { transform: rotate(0deg); }
    }
    @keyframes step-key {
      0%, 44.4% { fill: #33332f; }
      44.5%, 49% { fill: #e0661b; }
      49.1%, 100% { fill: #33332f; }
    }
    @keyframes paper {
      0%, 64% { transform: translateX(0); }
      66% { transform: translateX(-4px); }
      68% { transform: translateX(3px); }
      70% { transform: translateX(-2px); }
      72%, 100% { transform: translateX(0); }
    }
    @keyframes ok {
      0%, 65% { opacity: 0; }
      67%, 84% { opacity: 1; }
      88%, 100% { opacity: 0; }
    }
    @keyframes c-ready {
      0%, 7% { opacity: 1; }
      7.1%, 96% { opacity: 0; }
      96.1%, 100% { opacity: 1; }
    }
    @keyframes c-coarse {
      0%, 7% { opacity: 0; }
      7.1%, 44.4% { opacity: 1; }
      44.5%, 100% { opacity: 0; }
    }
    @keyframes c-step {
      0%, 44.4% { opacity: 0; }
      44.5%, 53.3% { opacity: 1; }
      53.4%, 100% { opacity: 0; }
    }
    @keyframes c-fine {
      0%, 53.3% { opacity: 0; }
      53.4%, 90% { opacity: 1; }
      93%, 100% { opacity: 0; }
    }
    /* A short flash of the knob ring on every detent. */
    @keyframes pulse {
      0%, 6.6% { opacity: 0; } 7% { opacity: 1; } 9% { opacity: 0; }
      15.5% { opacity: 0; } 15.9% { opacity: 1; } 17.9% { opacity: 0; }
      24.4% { opacity: 0; } 24.8% { opacity: 1; } 26.8% { opacity: 0; }
      33.3% { opacity: 0; } 33.7% { opacity: 1; } 35.7% { opacity: 0; }
      53.3% { opacity: 0; } 53.7% { opacity: 1; } 55.7% { opacity: 0; }
      62.2% { opacity: 0; } 62.6% { opacity: 1; } 64.6% { opacity: 0; }
      100% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }
  </style>

  <rect width="760" height="330" rx="18" fill="#1b1b1a"/>
  <text x="36" y="44" fill="#ececea" font-size="20" font-weight="700">Eyes on the nozzle. Fingers on the knob.</text>

  <!-- The pad: nine keys and a knob. -->
  <rect x="40" y="72" width="310" height="196" rx="20" fill="#262624" stroke="#3d3d38" stroke-width="1.5"/>
  <g class="key"><rect x="62" y="92" width="50" height="46" rx="8"/><text x="87" y="120">X−</text></g>
  <g class="key"><rect x="120" y="92" width="50" height="46" rx="8"/><text x="145" y="120">Y+</text></g>
  <g class="key"><rect x="178" y="92" width="50" height="46" rx="8"/><text x="203" y="120">X+</text></g>
  <g class="key" id="step-key"><rect x="62" y="146" width="50" height="46" rx="8"/><text x="87" y="174">STEP</text></g>
  <g class="key"><rect x="120" y="146" width="50" height="46" rx="8"/><text x="145" y="174">Y−</text></g>
  <g class="key"><rect x="178" y="146" width="50" height="46" rx="8"/><text x="203" y="174">HOME</text></g>
  <g class="key"><rect x="62" y="200" width="50" height="46" rx="8"/><text x="87" y="228">Z+</text></g>
  <g class="key"><rect x="120" y="200" width="50" height="46" rx="8"/><text x="145" y="228">Z−</text></g>
  <g class="key"><rect x="178" y="200" width="50" height="46" rx="8"/><text x="203" y="228" fill="#f2726a">STOP</text></g>

  <circle id="pulse" cx="300" cy="205" r="46" fill="none" stroke="#e0661b" stroke-width="3" opacity="0"/>
  <g stroke="#6b6b66" stroke-width="2" stroke-linecap="round">
    <line x1="300" y1="160" x2="300" y2="154"/><line x1="322.5" y1="166" x2="325.5" y2="160.8"/>
    <line x1="339" y1="182.5" x2="344.2" y2="179.5"/><line x1="345" y1="205" x2="351" y2="205"/>
    <line x1="339" y1="227.5" x2="344.2" y2="230.5"/><line x1="322.5" y1="244" x2="325.5" y2="249.2"/>
    <line x1="300" y1="250" x2="300" y2="256"/><line x1="277.5" y1="244" x2="274.5" y2="249.2"/>
    <line x1="261" y1="227.5" x2="255.8" y2="230.5"/><line x1="255" y1="205" x2="249" y2="205"/>
    <line x1="261" y1="182.5" x2="255.8" y2="179.5"/><line x1="277.5" y1="166" x2="274.5" y2="160.8"/>
  </g>
  <circle cx="300" cy="205" r="38" fill="#e8e8e2"/>
  <circle cx="300" cy="205" r="30" fill="#f4f4f2"/>
  <g id="knob-mark"><line x1="300" y1="198" x2="300" y2="176" stroke="#e0661b" stroke-width="6" stroke-linecap="round"/></g>
  <text x="300" y="112" fill="#9a9a94" font-size="12" text-anchor="middle">knob: Z</text>

  <!-- The printer: gantry, hotend, bed and a sheet of paper. -->
  <rect x="420" y="40" width="10" height="190" rx="3" fill="#2f2f2b"/>
  <rect x="710" y="40" width="10" height="190" rx="3" fill="#2f2f2b"/>
  <g id="head">
    <rect x="420" y="70" width="300" height="10" rx="3" fill="#3d3d38"/>
    <rect x="532" y="62" width="76" height="26" rx="5" fill="#4d4d47"/>
    <rect x="552" y="88" width="36" height="26" rx="3" fill="#c4520f"/>
    <rect x="560" y="114" width="20" height="8" fill="#d6d6d0"/>
    <path d="M562 122 L578 122 L572 132 L568 132 Z" fill="#e8e8e2"/>
  </g>
  <g id="paper">
    <rect x="510" y="194" width="140" height="5" rx="1" fill="#f4f4f2" transform="rotate(-1.5 580 196)"/>
  </g>
  <rect x="440" y="199" width="260" height="14" rx="3" fill="#5a5a54"/>
  <text id="ok" x="700" y="238" text-anchor="end" fill="#5bbf7a" font-size="15" font-weight="700" opacity="0">paper drags ✓</text>

  <!-- The console line of Mainsail or Fluidd. -->
  <rect x="36" y="284" width="688" height="30" rx="7" fill="#111110"/>
  <text class="mono muted" x="52" y="304">›</text>
  <text id="c-ready" class="mono muted" x="70" y="304">jogpad ready</text>
  <text id="c-coarse" class="mono" x="70" y="304" fill="#ececea" opacity="0">jogpad Z −1 mm</text>
  <text id="c-step" class="mono" x="70" y="304" fill="#e0661b" opacity="0">jogpad Step 0.1 mm</text>
  <text id="c-fine" class="mono" x="70" y="304" fill="#ececea" opacity="0">jogpad Z −0.1 mm</text>
</svg>
