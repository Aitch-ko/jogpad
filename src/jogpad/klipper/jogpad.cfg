# jogpad on/off switch for Mainsail and Fluidd.
# Written by `jogpad setup-switch`, which overwrites it on every run.
# It also adds to printer.cfg:  [include jogpad.cfg]
# and to moonraker.conf:
#   [power jogpad]
#   type: klipper_device
#   object_name: gcode_macro _JOGPAD
# Off means every key does nothing, STOP included. After a Klipper restart
# jogpad is on again.

[gcode_macro _JOGPAD]
description: Switch jogpad on (VALUE=1) or off (VALUE=0); without VALUE it toggles
variable_value: 1
gcode:
  {% set value = params.VALUE|default(1 - printer["gcode_macro _JOGPAD"].value)|int %}
  SET_GCODE_VARIABLE MACRO=_JOGPAD VARIABLE=value VALUE={1 if value else 0}
  RESPOND PREFIX=jogpad MSG="{'on' if value else 'off'}"
