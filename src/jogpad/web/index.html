<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>jogpad</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1><img src="favicon.svg" alt="" width="28" height="28"> jogpad <span id="version"></span></h1>
    <div class="header-end">
      <select id="theme"></select>
      <select id="language" aria-label="Language"></select>
      <span id="link" class="link"></span>
    </div>
  </header>
  <main>
    <section class="state" aria-live="polite">
      <div>
        <span id="label-switch"></span><strong id="switch">–</strong>
        <button id="switch-button" type="button" class="toggle" aria-pressed="false" hidden></button>
      </div>
      <div><span id="label-step"></span><strong id="step">–</strong></div>
      <div><span id="label-axis"></span><strong id="axis">–</strong></div>
      <div><span id="label-home"></span><strong id="home">–</strong></div>
      <div><span id="label-refusal"></span><strong id="refusal">–</strong></div>
      <p id="switch-message" class="message error"></p>
    </section>
    <section class="pad">
      <h2 id="layout-name"></h2>
      <p id="layout-note" class="note"></p>
      <svg id="pad" role="img"></svg>
      <div id="switched-off" class="off-note" hidden>
        <p id="switched-off-text"></p>
        <button id="switch-on" type="button"></button>
      </div>
    </section>
    <section class="recent">
      <h2 id="label-recent"></h2>
      <ol id="recent"></ol>
    </section>
    <section class="setup">
      <details id="setup-details">
        <summary><h2 id="label-setup"></h2></summary>
        <p id="setup-note" class="note"></p>
        <p id="setup-message" class="message" aria-live="polite"></p>
        <div id="answers" class="answers"></div>
        <div class="tables">
          <table>
            <caption id="label-keys"></caption>
            <tbody id="keys"></tbody>
          </table>
          <table>
            <caption id="label-directions"></caption>
            <tbody id="directions"></tbody>
          </table>
          <div id="mainsail">
            <p id="label-mainsail" class="caption"></p>
            <p id="mainsail-status" class="note"></p>
            <button id="mainsail-button" type="button" hidden></button>
          </div>
        </div>
      </details>
    </section>
  </main>
  <footer>
    <a id="link-repo" hidden></a>
    <a id="link-bug" hidden></a>
    <a id="link-changelog" hidden></a>
  </footer>
  <script src="app.js"></script>
</body>
</html>
