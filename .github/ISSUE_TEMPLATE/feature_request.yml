name: Feature request
description: Suggest something jogpad should do.
labels: ["type: feature"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what stops you today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How could jogpad solve it?
  - type: input
    id: firmware
    attributes:
      label: Firmware
      placeholder: "Klipper, RepRapFirmware, FluidNC, ..."
