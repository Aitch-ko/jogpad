[project]
site_name = "jogpad"
site_description = "A jog pendant for 3D printers and CNC machines, built from a programmable macro pad."
site_url = "https://aitch-ko.github.io/jogpad/"
repo_url = "https://github.com/Aitch-ko/jogpad"
repo_name = "Aitch-ko/jogpad"
edit_uri = "edit/main/docs/"
copyright = "MIT License, Aitch-ko and the jogpad contributors"

nav = [
  { "Home" = "index.md" },
  { "Safety" = "safety.md" },
  { "Installation" = "installation.md" },
  { "Klipper setup" = "usage.md" },
  { "Reference" = [
    { "Configuration" = "reference/config.md" },
    { "Command line" = "reference/cli.md" },
    { "HTTP API" = "reference/api.md" },
  ]},
  { "Contributing" = "contributing.md" },
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "content.action.edit",
  "navigation.footer",
  "navigation.indexes",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.superfences = {}
